name: Publish one documentation archive

on:
  workflow_dispatch:
    inputs:
      mode:
        description: Recover complete HTML from a trusted run, or intentionally build one source commit
        type: choice
        options: [recover, build]
        required: true
      slug:
        description: Release version, for example 1.1.0
        required: true
        type: string
      source_sha:
        description: Full release source SHA (build mode only)
        type: string
      recovery_run:
        description: Successful main docs run ID (recover mode only)
        type: string
      storage_tag:
        description: Existing dedicated storage release, created separately with approval
        default: docs-archives
        required: true
        type: string

permissions:
  contents: read
  actions: read

concurrency:
  group: docs-archive-${{ inputs.slug }}
  cancel-in-progress: false

jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          path: tools
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.17"
          enable-cache: false
      - name: Validate explicit inputs
        working-directory: tools
        env:
          SLUG: ${{ inputs.slug }}
          SOURCE_SHA: ${{ inputs.source_sha }}
          MODE: ${{ inputs.mode }}
          RECOVERY_RUN: ${{ inputs.recovery_run }}
          STORAGE_TAG: ${{ inputs.storage_tag }}
        run: |
          uv run --no-project --with "pyyaml==6.0.3" python -c '
          import os, re
          from build_scripts.docs_archive import validate_identity
          mode = os.environ["MODE"]
          if mode not in ("build", "recover"):
              raise ValueError("invalid mode")
          validate_identity(slug=os.environ["SLUG"], source_sha=os.environ["SOURCE_SHA"] if mode == "build" else "0" * 40, base="/${{ github.event.repository.name }}")
          if mode == "recover" and not re.fullmatch(r"[1-9][0-9]*", os.environ["RECOVERY_RUN"]):
              raise ValueError("recovery requires a run ID")
          if not re.fullmatch(r"docs-archives(?:-[A-Za-z0-9_.-]+)?", os.environ["STORAGE_TAG"]):
              raise ValueError("dedicated docs archive release required")
          '
      - name: Recover original HTML
        if: inputs.mode == 'recover'
        working-directory: tools
        env:
          GH_TOKEN: ${{ github.token }}
          SLUG: ${{ inputs.slug }}
          RECOVERY_RUN: ${{ inputs.recovery_run }}
        run: |
          uv run --no-project --with "pyyaml==6.0.3" python -m build_scripts.docs_archive_release recover \
            --repository "$GITHUB_REPOSITORY" --run-id "$RECOVERY_RUN" --slug "$SLUG" \
            --base "/${{ github.event.repository.name }}" --output-dir ../archive
      - name: Checkout the explicit source commit
        if: inputs.mode == 'build'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.source_sha }}
          path: source
          persist-credentials: false
      - name: Build only the requested version
        if: inputs.mode == 'build'
        working-directory: source
        env:
          BASE_URL: /${{ github.event.repository.name }}/${{ inputs.slug }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$SOURCE_SHA"
          choice=$(python -c '
          import tomllib
          d = tomllib.load(open("pyproject.toml", "rb"))
          if "dev" in d.get("dependency-groups", {}):
              print("--group dev")
          elif "dev" in d.get("project", {}).get("optional-dependencies", {}):
              print("--extra dev")
          else:
              raise ValueError("source has no dev dependency group/extra")
          ')
          uv sync --frozen $choice
          uv run --frozen --no-sync python -m build_scripts.pydoc2json pyrit --submodules -o doc/_api/pyrit_all.json
          uv run --frozen --no-sync python -m build_scripts.gen_api_md
          cd doc
          uv run --frozen --no-sync jupyter-book build --all --html
      - name: Pack raw HTML with build provenance
        if: inputs.mode == 'build'
        working-directory: tools
        env:
          SLUG: ${{ inputs.slug }}
          SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          uv run --no-project --with "pyyaml==6.0.3" python -c '
          import json, os
          from pathlib import Path
          from build_scripts.docs_archive import pack
          env = os.environ
          metadata = dict(schema=1, slug=env["SLUG"], source_sha=env["SOURCE_SHA"],
              base="/${{ github.event.repository.name }}", kind="build", repository=env["GITHUB_REPOSITORY"],
              workflow_sha=env["GITHUB_SHA"], run_id=int(env["GITHUB_RUN_ID"]), run_attempt=int(env["GITHUB_RUN_ATTEMPT"]))
          output = Path("../archive")
          output.mkdir()
          archive = output / ("docs-" + env["SLUG"] + "-" + env["SOURCE_SHA"] + "-run" + env["GITHUB_RUN_ID"] + "-" + env["GITHUB_RUN_ATTEMPT"] + ".tar.gz")
          pin = pack(site=Path("../source/doc/_build/html"), output=archive, metadata=metadata)
          archive.with_suffix(".json").write_text(json.dumps(pin, indent=2) + "\n")
          '
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-archive-input
          path: archive
          if-no-files-found: error
          retention-days: 7
          include-hidden-files: true

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment: docs-archives
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.13"
      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.9.17"
          enable-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: docs-archive-input
          path: archive
      - name: Publish new immutable asset and propose pin
        env:
          GH_TOKEN: ${{ github.token }}
          STORAGE_TAG: ${{ inputs.storage_tag }}
        run: |
          set -euo pipefail
          archives=(archive/*.tar.gz)
          test "${#archives[@]}" -eq 1
          archive="${archives[0]}"
          uv run --no-project --with "pyyaml==6.0.3" python -m build_scripts.docs_archive_release publish \
            --repository "$GITHUB_REPOSITORY" --tag "$STORAGE_TAG" \
            --archive "$archive" --pin "${archive%.gz}.json" > archive-pin.json
          cat archive-pin.json >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: proposed-docs-archive-pin
          path: archive-pin.json
          if-no-files-found: error
